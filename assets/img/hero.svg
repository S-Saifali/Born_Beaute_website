<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Abstract salon interior">
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1917"/>
      <stop offset="0.55" stop-color="#2f2b28"/>
      <stop offset="1" stop-color="#4a433d"/>
    </linearGradient>
    <radialGradient id="window" cx="0.78" cy="0.28" r="0.62">
      <stop offset="0" stop-color="#cfc6bd" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#8d857c" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mirror" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d6560" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#221f1d" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="figure" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f0e0d" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#0f0e0d" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="bokeh" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#room)"/>
  <rect width="1600" height="1000" fill="url(#window)"/>

  <!-- back wall: mirror stations -->
  <g opacity="0.9">
    <rect x="760" y="120" width="200" height="440" fill="url(#mirror)"/>
    <rect x="1000" y="150" width="200" height="410" fill="url(#mirror)"/>
    <rect x="1240" y="120" width="200" height="440" fill="url(#mirror)"/>
    <g fill="#e8e0d6" opacity="0.55">
      <circle cx="748" cy="170" r="7"/><circle cx="748" cy="250" r="7"/><circle cx="748" cy="330" r="7"/><circle cx="748" cy="410" r="7"/>
      <circle cx="988" cy="200" r="7"/><circle cx="988" cy="280" r="7"/><circle cx="988" cy="360" r="7"/><circle cx="988" cy="440" r="7"/>
      <circle cx="1228" cy="170" r="7"/><circle cx="1228" cy="250" r="7"/><circle cx="1228" cy="330" r="7"/><circle cx="1228" cy="410" r="7"/>
    </g>
  </g>

  <!-- counter -->
  <rect x="700" y="600" width="900" height="18" fill="#0f0e0d" opacity="0.55"/>
  <g opacity="0.5" fill="#0f0e0d">
    <rect x="800" y="540" width="26" height="60" rx="3"/>
    <rect x="846" y="556" width="20" height="44" rx="3"/>
    <rect x="1300" y="532" width="30" height="68" rx="4"/>
    <rect x="1348" y="560" width="18" height="40" rx="3"/>
  </g>

  <!-- seated guest, back to camera (held out of focus) -->
  <g fill="url(#figure)" filter="url(#bokeh)" opacity="0.85">
    <path d="M1040 1000c0-150 52-236 150-236s150 86 150 236z"/>
    <ellipse cx="1190" cy="700" rx="86" ry="98"/>
    <path d="M1104 690c0-90 38-146 86-146s86 56 86 146c0 66-24 120-42 120-14 0-16-40-44-40s-30 40-44 40c-18 0-42-54-42-120z" opacity="0.9"/>
  </g>

  <!-- stylist, standing -->
  <g fill="#0b0a09" opacity="0.6" filter="url(#bokeh)">
    <path d="M1310 1000c0-208 44-318 118-318s118 110 118 318z"/>
    <circle cx="1428" cy="618" r="66"/>
  </g>

  <!-- light falloff + grain -->
  <ellipse cx="1250" cy="300" rx="420" ry="300" fill="#ffffff" opacity="0.07" filter="url(#soft)"/>
  <rect width="1600" height="1000" filter="url(#grain)" opacity="0.16"/>
</svg>
